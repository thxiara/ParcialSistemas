<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/front/dist/js/api.js" defer></script>
    <script src="/front/dist/js/pages/call-cats.js" defer></script>
    <script src="/front/dist/js/pages/cats.js" defer></script>
    <link rel="stylesheet" href="/front/dist/css/styles.css">
    <link rel="stylesheet" href="/front/dist/css/addCat.css">
    <link rel="stylesheet" href="/front/dist/css/addCatresponsive.css">
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <span class="navbar-name">Cats</span>
      </a>

      <nav class="navbar-links" aria-label="Navegación principal">
        <a href="/" class="navbar-link active">Inicio</a>
        <a href="/cat/list" class="navbar-link">Listado</a>
        <a href="/cat/add" class="navbar-link">Agregar</a>
      </nav>

      <a href="/cat/list" class="navbar-cta">Administrar</a>
    </div>
  </header>

  <main class="cat-add">
        <form class="form-card" id="cat-form">
            <h1 class="form-title">Agregar gato</h1>

            <div class="form-group">
                <label for="name">Nombre</label>
                <input id="name" name="name" type="text" required placeholder="Botitas">
            </div>

            <div class="form-group">
                <label for="breed">Raza</label>
                <input id="breed" name="breed" type="text" required placeholder="Balinés">
            </div>

            <div class="form-group">
                <label for="age">Edad (años)</label>
                <input id="age" name="age" type="number" required value="0">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Agregar gato</button>
            </div>
        </form>
    </main>
</body>
</html>
